<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Altus Performance · Petit jeu et putting</title>
  <meta name="description" content="Défis de petit jeu et de putting, classements et suivi des joueurs du groupe Altus Performance.">
  <meta name="theme-color" content="#14325c">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header>
    <h1 class="titre-altus">⛳ Altus Performance</h1>
    <p class="date" id="sous-titre"></p>
    <p class="bandeau-demo" id="bandeau-demo" hidden>🧪 Mode démo : les autres joueurs sont fictifs et rien n'est envoyé en ligne.</p>
  </header>

  <nav class="onglets onglets-altus" id="onglets" aria-label="Vues"></nav>

  <main id="contenu"></main>

  <!-- Écran de jeu des exos interactifs (exos-points.js) -->
  <div id="trefle-jeu" class="trefle-jeu" hidden></div>

  <footer class="pied">
    <button type="button" class="lien-bouton" data-a="ouvrir-coach">🧑‍🏫 Espace coachs</button> ·
    <button type="button" class="lien-bouton" data-a="changer-joueur">Changer de joueur</button>
  </footer>

  <!-- « ?v=6 » = numéro de version : l'augmenter à chaque mise en ligne pour que les
       téléphones prennent tout de suite les nouveaux fichiers (et pas ceux en cache). -->
  <!-- Ordre important : base, scores, jeux (copie de l'appli golf), exos Altus, puis la page -->
  <script src="base.js?v=6"></script>
  <script src="scores.js?v=6"></script>
  <script src="exos-points.js?v=6"></script>
  <script src="exos-altus.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
