<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Altus Performance · Petit jeu et putting</title>
  <meta name="description" content="Défis de petit jeu et de putting, classements et suivi des joueurs du groupe Altus Performance.">
  <meta name="theme-color" content="#365571">
  <link rel="icon" href="images/logo.svg?v=22" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/logo.svg?v=22">
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <header>
    <h1 class="titre-altus"><img src="images/logo.svg?v=22" alt="" class="logo-altus" width="44" height="44"> Altus Performance</h1>
    <p class="date" id="sous-titre"></p>
    <p class="bandeau-demo" id="bandeau-demo" hidden>🧪 Mode démo : les autres joueurs sont fictifs et rien n'est envoyé en ligne.</p>
  </header>

  <nav class="onglets onglets-altus" id="onglets" aria-label="Vues"></nav>

  <main id="contenu"></main>

  <!-- Écran de jeu des exos interactifs (exos-points.js) -->
  <div id="trefle-jeu" class="trefle-jeu" hidden></div>

  <footer class="pied">
    <button type="button" class="lien-bouton" data-a="ouvrir-coach">🧑‍🏫 Espace coachs</button>    <span id="lien-deconnexion"> · <button type="button" class="lien-bouton" data-a="deconnexion">Se déconnecter</button></span>
  </footer>

  <!-- « ?v=22 » = numéro de version : l'augmenter à chaque mise en ligne pour que les
       téléphones prennent tout de suite les nouveaux fichiers (et pas ceux en cache). -->
  <!-- Ordre important : base, scores, jeux (copie de l'appli golf), exos Altus, puis la page -->
  <script src="base.js?v=22"></script>
  <script src="scores.js?v=22"></script>
  <script src="exos-points.js?v=22"></script>
  <script src="exos-altus.js?v=22"></script>
  <script src="classeur.js?v=22"></script>
  <script src="app.js?v=22"></script>
</body>
</html>
